[package]
name = "type-cast"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Backend for a typing-test website with server-verified results and leaderboards."
license = "MIT"
publish = false

[dependencies]
# Application-level error context in `main`.
anyhow = "1.0"
# HTTP router and extractors; `macros` derives the JSON-error extractors.
axum = { version = "0.8.9", features = ["macros"] }
# URL-safe encoding of signed test tokens.
base64 = "0.22"
# Timestamps for stored results.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# Loads `.env` for local development.
dotenvy = "0.15"
# Keyed MAC that signs test tokens.
hmac = "0.13"
# Keeps the token secret out of logs and debug output.
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
# Async Postgres driver with embedded migrations; `json` maps the JSONB breakdown column.
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal"] }
# Compression, CORS, timeouts and request tracing middleware.
tower-http = { version = "0.7", features = [
    "compression-br",
    "compression-gzip",
    "cors",
    "timeout",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28", features = ["fast-rng", "serde", "v4"] }

[dev-dependencies]
# Builds and inspects JSON bodies in tests.
serde_json = "1.0"
# Reads response bodies in router tests.
http-body-util = "0.1"
# `ServiceExt::oneshot` drives the router without a socket in tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "fat"
