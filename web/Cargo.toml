[package]
name = "type-cast-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "type-cast frontend: a typing test typed on an isometric typewriter."
license = "MIT"
publish = false

[dependencies]
# UI framework, compiled to WebAssembly for the browser.
dioxus = { version = "0.7.10", features = ["web"] }
# HTTP calls to the type-cast server.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
# Async timers for key, strike and clock timing.
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
# Parses the embedded typewriter figure.
serde_json = "1.0"
thiserror = "2.0"
# Browser APIs: Web Audio for the machine's sounds, storage and media queries for preferences.
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "MediaQueryList",
    "Performance",
    "Storage",
    "Window",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
